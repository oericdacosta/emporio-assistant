[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "holidays>=0.107,<1",
    "langgraph>=1.2,<2",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "streamlit>=1.40,<2",
    "tzdata>=2026.1",
]

[project.scripts]
emporio = "emporio.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "hypothesis>=6.170,<7",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.hatch.build.targets.wheel.force-include]
"data/raw" = "emporio/_data/raw"
"data/policies.md" = "emporio/_data/policies.md"
"data/policies_notes.json" = "emporio/_data/policies_notes.json"
"data/policy_rules.json" = "emporio/_data/policy_rules.json"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = [".", "tests"]
markers = ["live: chama o provedor real (exige EMPORIO_LIVE=1 e OPENAI_API_KEY); nunca roda no CI"]

[tool.coverage.run]
branch = true
source = ["src/emporio"]
omit = ["*/cli.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
