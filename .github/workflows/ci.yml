name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.6"
  PRIMARY_PYTHON: "3.12"
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PRIMARY_PYTHON }}
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check --diff .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PRIMARY_PYTHON }}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync mypy

  tests:
    name: Tests (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PRIMARY_PYTHON }}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync pytest --cov=emporio --cov-branch --cov-report=term-missing -q

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLI oficial em container (MIT, sem licença nem token). Imagem fixada por tag e digest.
      - name: gitleaks (histórico completo)
        run: >
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner /repo

  pr-title:
    name: PR title and commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Título e commits no padrão Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          RE_TITLE="^(${TYPES})\([a-z][a-z0-9-]*\)!?: [a-z].+$"
          RE_COMMIT="^(${TYPES})(\([a-z][a-z0-9-]*\))?!?: [a-z].+$"
          if ! grep -Eq "$RE_TITLE" <<<"$TITLE"; then
            echo "::error::título fora do padrão: '$TITLE' (exemplo: feat(domain): add pricing rules)"
            exit 1
          fi
          bad="$(git log --no-merges --format=%s "$BASE..$HEAD_SHA" | grep -Ev "$RE_COMMIT" || true)"
          if [ -n "$bad" ]; then
            echo "::error::commits fora do padrão:"
            echo "$bad"
            exit 1
          fi

  ci-gate:
    name: CI gate
    if: always()
    needs: [lint, types, tests, secrets, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Agregar resultados
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          if grep -Eq '"result": ?"(failure|cancelled)"' <<<"$NEEDS_JSON"; then
            echo "::error::algum job obrigatório falhou ou foi cancelado"
            exit 1
          fi
